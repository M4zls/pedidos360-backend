server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: pedidos360-kafka-admin

app:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:4200}
  auth:
    microsoft:
      client-id: ${MICROSOFT_CLIENT_ID:7b48efc0-534c-4b13-9e02-4c60a129f151}
  # Configuracion centralizada del acceso al cluster de Kafka. Este servicio
  # administra topicos, configuraciones y consumer groups (AdminClient); no
  # publica ni consume mensajes de negocio.
  kafka:
    admin:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094,localhost:9095}
      request-timeout-ms: ${KAFKA_ADMIN_TIMEOUT_MS:10000}

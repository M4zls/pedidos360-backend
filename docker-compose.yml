# ─────────────────────────────────────────────────────────────
#  Pedidos360 — backend (servicios, bases y RabbitMQ)
#
#  Sin gateway intermedio: cada servicio valida su propio JWT de
#  Microsoft (MultiIssuerAuthenticationManagerResolver) y el front
#  (repo pedidos360-frontend, su propio docker-compose.yml) le pega
#  directo por path a cada puerto publicado:
#    /api/me                 ->  auth               (8080)
#    /api/inventory/*        ->  inventory          (8083)
#    /api/orders/*           ->  orders             (8082, interno 8081)
#    /api/admin/rabbitmq/*   ->  rabbitmq-admin      (8084)
#
#    orders  ->  inventory   (consulta el catálogo por HTTP)
#
#  Uso:
#    docker compose up --build     # auth en http://localhost:8080
#    docker compose down           # parar (las bases persisten)
#    docker compose down -v        # parar y borrar las bases
# ─────────────────────────────────────────────────────────────

services:
  auth:
    build: ./auth-service
    depends_on:
      rabbitmq1:
        condition: service_healthy
    environment:
      DB_URL: jdbc:sqlite:/data/pedidos360-auth.db
      RABBITMQ_HOST: rabbitmq1
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-7b48efc0-534c-4b13-9e02-4c60a129f151}
      CORS_ALLOWED_ORIGIN: http://localhost:8081   # origen del front
    volumes:
      - auth-db:/data
    ports:
      - "8080:8080"
    restart: unless-stopped

  inventory:
    build: ./inventory-service
    depends_on:
      rabbitmq1:
        condition: service_healthy
    environment:
      DB_URL: jdbc:sqlite:/data/pedidos360-inventory.db
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-7b48efc0-534c-4b13-9e02-4c60a129f151}
      CORS_ALLOWED_ORIGIN: http://localhost:8081   # origen del front
      RABBITMQ_HOST: rabbitmq1
    volumes:
      - inventory-db:/data
    ports:
      - "8083:8083"
    restart: unless-stopped

  orders:
    build: ./orders-service
    depends_on:
      inventory:
        condition: service_started
      rabbitmq1:
        condition: service_healthy
    environment:
      DB_URL: jdbc:sqlite:/data/pedidos360-orders.db
      INVENTORY_BASE_URL: http://inventory:8083
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-7b48efc0-534c-4b13-9e02-4c60a129f151}
      CORS_ALLOWED_ORIGIN: http://localhost:8081   # origen del front
      RABBITMQ_HOST: rabbitmq1
    volumes:
      - orders-db:/data
    ports:
      - "8082:8081"
    restart: unless-stopped

  rabbitmq1:
    image: rabbitmq:4-management
    hostname: rabbitmq1
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-pedidos360-cluster-cookie}
    volumes:
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - rabbitmq1-data:/var/lib/rabbitmq
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq2:
    image: rabbitmq:4-management
    hostname: rabbitmq2
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-pedidos360-cluster-cookie}
    volumes:
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - rabbitmq2-data:/var/lib/rabbitmq
    ports:
      - "5673:5672"
      - "15673:15672"
    depends_on:
      rabbitmq1:
        condition: service_healthy
    restart: unless-stopped

  rabbitmq-admin:
    build: ./rabbitmq-admin-service
    depends_on:
      rabbitmq1:
        condition: service_healthy
    environment:
      RABBITMQ_MANAGEMENT_HOST: rabbitmq1
      RABBITMQ_MANAGEMENT_PORT: "15672"
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-7b48efc0-534c-4b13-9e02-4c60a129f151}
      CORS_ALLOWED_ORIGIN: http://localhost:8081   # origen del front
    ports:
      - "8084:8084"
    restart: unless-stopped

volumes:
  auth-db:
  inventory-db:
  orders-db:
  rabbitmq1-data:
  rabbitmq2-data:

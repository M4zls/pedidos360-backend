# ─────────────────────────────────────────────────────────────
#  Pedidos360 — backend (servicios, bases y RabbitMQ)
#
#  Sin gateway intermedio: cada servicio valida su propio JWT de
#  Microsoft (MultiIssuerAuthenticationManagerResolver) y el front
#  (repo pedidos360-frontend, su propio docker-compose.yml) le pega
#  directo por path a cada servicio:
#    /api/me                 ->  auth
#    /api/inventory/*        ->  inventory
#    /api/orders/*           ->  orders
#    /api/admin/rabbitmq/*   ->  rabbitmq-admin
#    /api/admin/kafka/*      ->  kafka-admin
#
#    orders  ->  inventory   (consulta el catálogo por HTTP)
#
#  La red "pedidos360-net" (declarada abajo) la comparte el compose del
#  front y los de Kafka (docker-compose.kafka.yml, docker-compose.kafka-ui.yml):
#  asi todo se habla por nombre (ej. http://auth:8080, http://kafka1:9092) en
#  vez de host.docker.internal, que en Windows a veces resuelve una IP IPv6
#  inalcanzable y tira 502 intermitentes.
#
#  orders e inventory publican a Kafka ademas de RabbitMQ (streaming de
#  analitica, ver docker-compose.kafka.yml). Si ese stack no esta levantado
#  todavia, el cliente Kafka solo reintenta en segundo plano: no bloquea el
#  arranque ni afecta el flujo transaccional de RabbitMQ.
#
#  Uso:
#    docker compose up --build     # auth en http://localhost:8080
#    docker compose down           # parar (las bases persisten)
#    docker compose down -v        # parar y borrar las bases
# ─────────────────────────────────────────────────────────────

services:
  auth:
    build: ./auth-service
    depends_on:
      rabbitmq1:
        condition: service_healthy
    environment:
      DB_URL: jdbc:sqlite:/data/pedidos360-auth.db
      RABBITMQ_HOST: rabbitmq1
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-7b48efc0-534c-4b13-9e02-4c60a129f151}
      CORS_ALLOWED_ORIGIN: http://localhost:8081   # origen del front
      # JAVA_TOOL_OPTIONS lo lee la JVM sola al arrancar (lo imprime por
      # stderr: "Picked up..."), no hace falta tocar el ENTRYPOINT. Achica el
      # heap para que entren mas procesos en instancias chicas (EC2 1GB).
      JAVA_TOOL_OPTIONS: -Xmx192m
    volumes:
      - auth-db:/data
    ports:
      - "8080:8080"
    restart: unless-stopped

  inventory:
    build: ./inventory-service
    depends_on:
      rabbitmq1:
        condition: service_healthy
    environment:
      DB_URL: jdbc:sqlite:/data/pedidos360-inventory.db
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-7b48efc0-534c-4b13-9e02-4c60a129f151}
      CORS_ALLOWED_ORIGIN: http://localhost:8081   # origen del front
      RABBITMQ_HOST: rabbitmq1
      KAFKA_BOOTSTRAP_SERVERS: kafka1:9092,kafka2:9092,kafka3:9092
    volumes:
      - inventory-db:/data
    ports:
      - "8083:8083"
    restart: unless-stopped

  orders:
    build: ./orders-service
    depends_on:
      inventory:
        condition: service_started
      rabbitmq1:
        condition: service_healthy
    environment:
      DB_URL: jdbc:sqlite:/data/pedidos360-orders.db
      INVENTORY_BASE_URL: http://inventory:8083
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-7b48efc0-534c-4b13-9e02-4c60a129f151}
      CORS_ALLOWED_ORIGIN: http://localhost:8081   # origen del front
      RABBITMQ_HOST: rabbitmq1
      KAFKA_BOOTSTRAP_SERVERS: kafka1:9092,kafka2:9092,kafka3:9092
    volumes:
      - orders-db:/data
    ports:
      - "8082:8081"
    restart: unless-stopped

  rabbitmq1:
    image: rabbitmq:4-management
    hostname: rabbitmq1
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-pedidos360-cluster-cookie}
    volumes:
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - rabbitmq1-data:/var/lib/rabbitmq
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq2:
    image: rabbitmq:4-management
    hostname: rabbitmq2
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-pedidos360-cluster-cookie}
    volumes:
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - rabbitmq2-data:/var/lib/rabbitmq
    ports:
      - "5673:5672"
      - "15673:15672"
    depends_on:
      rabbitmq1:
        condition: service_healthy
    restart: unless-stopped

  rabbitmq-admin:
    build: ./rabbitmq-admin-service
    depends_on:
      rabbitmq1:
        condition: service_healthy
    environment:
      RABBITMQ_MANAGEMENT_HOST: rabbitmq1
      RABBITMQ_MANAGEMENT_PORT: "15672"
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-7b48efc0-534c-4b13-9e02-4c60a129f151}
      CORS_ALLOWED_ORIGIN: http://localhost:8081   # origen del front
    ports:
      - "8084:8084"
    restart: unless-stopped

  kafka-admin:
    build: ./kafka-admin-service
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka1:9092,kafka2:9092,kafka3:9092
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-7b48efc0-534c-4b13-9e02-4c60a129f151}
      CORS_ALLOWED_ORIGIN: http://localhost:8081   # origen del front
    ports:
      - "8085:8085"
    restart: unless-stopped

networks:
  default:
    name: pedidos360-net

volumes:
  auth-db:
  inventory-db:
  orders-db:
  rabbitmq1-data:
  rabbitmq2-data:

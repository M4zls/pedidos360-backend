# Config solo para tests: H2 en memoria en lugar de SQLite.
spring.datasource.url=jdbc:h2:mem:pedidos360-orders;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.sql.init.mode=never

inventory.base-url=http://localhost:9999
app.auth.microsoft.client-id=test-client

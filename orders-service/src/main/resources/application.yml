server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: pedidos360-orders
  # Base de datos PROPIA del servicio de pedidos (no comparte con inventario).
  datasource:
    url: ${DB_URL:jdbc:sqlite:pedidos360-orders.db}
  jpa:
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate.dialect: org.hibernate.community.dialect.SQLiteDialect
      hibernate.format_sql: true
  sql:
    init:
      mode: never
  # Conexion al cluster de RabbitMQ (configuracion centralizada: un solo
  # lugar para host/credenciales, nada de esto se repite en el codigo).
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        acknowledge-mode: manual
        # Un mensaje rechazado (nack) no vuelve a la cola: va a su DLQ.
        default-requeue-rejected: false

# Servicio de inventario (HTTP). Proceso y base propios.
inventory:
  base-url: ${INVENTORY_BASE_URL:http://localhost:8083}

app:
  # Topologia de RabbitMQ (configuracion centralizada): nombres de exchanges,
  # colas con su DLX/DLQ y routing keys. Se leen con RabbitTopologyProperties;
  # el codigo nunca usa un literal suelto.
  rabbitmq:
    exchanges:
      orders-direct: orders.direct
      orders-status-topic: orders.status.topic
    routing-keys:
      # inventory-service escucha esta misma key en orders.direct.
      order-created: order.created
      # Cambio de estado -> "order.status.<estado>" (ej. order.status.listo).
      order-status-prefix: "order.status."
    queues:
      orders-notifications:
        name: orders.notifications
        dlx: orders.notifications.dlx
        dlq: orders.notifications.dlq
      dispatch-ready:
        name: dispatch.ready
        dlx: dispatch.ready.dlx
        dlq: dispatch.ready.dlq
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:4200}
  # El rol (ADMIN/OPERADOR/CLIENTE) sale del claim "roles" del JWT de
  # Microsoft (App Roles asignadas en Azure). Sin App Role reconocida, se
  # rechaza el login — ver RoleJwtAuthenticationConverter.
  auth:
    microsoft:
      # Mismo "Application (client) ID" que el servicio de auth y el front.
      client-id: ${MICROSOFT_CLIENT_ID:7b48efc0-534c-4b13-9e02-4c60a129f151}

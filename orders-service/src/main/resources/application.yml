server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: pedidos360-orders
  # Base de datos PROPIA del servicio de pedidos (no comparte con inventario).
  datasource:
    url: ${DB_URL:jdbc:sqlite:pedidos360-orders.db}
  jpa:
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate.dialect: org.hibernate.community.dialect.SQLiteDialect
      hibernate.format_sql: true
  sql:
    init:
      mode: never

# Servicio de inventario (HTTP). Proceso y base propios.
inventory:
  base-url: ${INVENTORY_BASE_URL:http://localhost:8083}

app:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:4200}
  # --- Roles por email (resuelve el rol de los tokens de Microsoft) ---
  # Debe coincidir con la config del servicio de auth.
  roles:
    admins:
      - pedro.porro@proyecto3602.onmicrosoft.com
    operadores:
      - juanfaure@proyecto3602.onmicrosoft.com
  auth:
    microsoft:
      # Mismo "Application (client) ID" que el servicio de auth y el front.
      client-id: ${MICROSOFT_CLIENT_ID:7b48efc0-534c-4b13-9e02-4c60a129f151}

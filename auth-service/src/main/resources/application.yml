server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: pedidos360-auth
  # --- Identity: SQLite ---
  # Base propia de este servicio (tabla app_user: usuarios y sus roles). Un
  # solo archivo, sin servidor ni Docker. Para usar otra base, pasar DB_URL.
  datasource:
    url: ${DB_URL:jdbc:sqlite:pedidos360-auth.db}
  jpa:
    hibernate:
      # 'update' crea/actualiza las tablas al arrancar. Para la demo alcanza.
      ddl-auto: ${DB_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate.dialect: org.hibernate.community.dialect.SQLiteDialect
      hibernate.format_sql: true
  sql:
    init:
      mode: never

app:
  # --- Roles por email ---
  # El rol (ADMIN / OPERADOR / CLIENTE) se asigna por direccion de correo. Los
  # emails que no figuren aca quedan como CLIENTE al primer login. Un ADMIN
  # puede cambiar roles en runtime desde /api/admin/users (se guardan en la
  # tabla app_user). inventory-service y orders-service tienen una COPIA de
  # esta misma lista (para resolver el rol de tokens de Microsoft sin App
  # Roles, sin depender de esta base) — si la cambiás, actualizalas ahí también.
  roles:
    admins:
      - cam.carrascop@duocuc.cl
    operadores:
      - max.palma@duocuc.cl
      # car.donosol@duocuc.cl queda como CLIENTE (no listado)
  auth:
    google:
      # OAuth Client ID (tipo "Web application") de Google Cloud Console.
      # Como obtenerlo: https://console.cloud.google.com -> APIs & Services
      # -> Credentials -> Create Credentials -> OAuth client ID -> Web
      # application -> Authorized JavaScript origins: http://localhost:4200
      # Debe ser EXACTAMENTE el mismo valor que GOOGLE_CLIENT_ID en
      # front/src/app/auth/google/google-auth.config.ts
      client-id: <GOOGLE_CLIENT_ID>
    microsoft:
      # "Application (client) ID" del App Registration en Azure AD.
      # Los tres servicios (auth, inventory, orders) validan el mismo claim
      # "aud", asi que tiene que coincidir con MICROSOFT_CLIENT_ID en
      # front/src/app/auth/microsoft/microsoft-auth.config.ts y con el
      # app.auth.microsoft.client-id de los otros dos servicios.
      #
      # Valor tomado del repo de referencia CVm0/pedidos360-frontend. Cambialo
      # por el tuyo cuando crees tu propio App Registration.
      client-id: ${MICROSOFT_CLIENT_ID:89fde275-566d-498a-a663-bbed17a2a29d}
    local:
      # Login de USUARIO/CONTRASEÑA (POST /api/auth/login), ademas de
      # Microsoft. Lista fija en config, sin base de datos ni hash de
      # contraseñas: es para la demo. Cada usuario define su rol, que viaja
      # en el claim "roles" del JWT emitido (los otros servicios lo leen ahí,
      # no de esta base).
      #   - Microsoft (cam.carrascop)  -> ADMIN   (por email, ver app.roles)
      #   - operador / operador123     -> OPERADOR
      #   - cliente  / cliente123      -> CLIENTE
      users:
        - username: operador
          password: operador123
          name: Operador Demo
          role: OPERADOR
        - username: cliente
          password: cliente123
          name: Cliente Demo
          role: CLIENTE
        - username: demo
          password: demo123
          name: Usuario de ejemplo
          role: CLIENTE
      # Clave para firmar (HS256) los JWT que emite este servicio. Minimo 32
      # caracteres. Tiene que ser LA MISMA en inventory-service y
      # orders-service (validan el mismo JWT). Cambiala por una propia (y
      # sacala de application.yml, p.ej. variable de entorno) antes de usar
      # esto en serio.
      jwt-secret: ${LOCAL_JWT_SECRET:cambia-esta-clave-secreta-por-una-propia-de-al-menos-32-caracteres}
      audience: ${LOCAL_JWT_AUDIENCE:pedidos360-front}

server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: pedidos360-auth
  # --- Identity: SQLite ---
  # Base propia de este servicio (tabla app_user: usuarios y sus roles). Un
  # solo archivo, sin servidor ni Docker. Para usar otra base, pasar DB_URL.
  datasource:
    url: ${DB_URL:jdbc:sqlite:pedidos360-auth.db}
  jpa:
    hibernate:
      # 'update' crea/actualiza las tablas al arrancar. Para la demo alcanza.
      ddl-auto: ${DB_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate.dialect: org.hibernate.community.dialect.SQLiteDialect
      hibernate.format_sql: true
  sql:
    init:
      mode: never

app:
  # --- Roles por email ---
  # El rol (ADMIN / OPERADOR / CLIENTE) se asigna por direccion de correo,
  # segun las cuentas reales del tenant Entra External ID (CIAM)
  # proyecto3602.onmicrosoft.com. Los emails que no figuren aca quedan como
  # CLIENTE al primer login (ej. raul.perez@proyecto3602.onmicrosoft.com,
  # que arma pedidos desde la carta). El rol queda FIJO por email: no hay
  # forma de cambiarlo desde la UI, y se resincroniza en cada login
  # (UserDirectory.resolve) por si esta lista cambia. inventory-service y
  # orders-service tienen una COPIA de esta misma lista (para resolver el rol
  # de tokens de Microsoft sin depender de esta base) — si la cambiás,
  # actualizalas ahí también.
  roles:
    admins:
      - pedro.porro@proyecto3602.onmicrosoft.com
    operadores:
      - juanfaure@proyecto3602.onmicrosoft.com
      # raul.perez@proyecto3602.onmicrosoft.com queda como CLIENTE (no listado)
  auth:
    microsoft:
      # "Application (client) ID" del App Registration en Azure AD.
      # Los tres servicios (auth, inventory, orders) validan el mismo claim
      # "aud", asi que tiene que coincidir con MICROSOFT_CLIENT_ID en
      # front/src/app/auth/microsoft/microsoft-auth.config.ts y con el
      # app.auth.microsoft.client-id de los otros dos servicios.
      #
      # App Registration propio (single-tenant, tenant c450c5ae-...,
      # dominio proyecto3602.onmicrosoft.com).
      client-id: ${MICROSOFT_CLIENT_ID:7b48efc0-534c-4b13-9e02-4c60a129f151}

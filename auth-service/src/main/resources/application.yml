server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: pedidos360-auth
  # --- Identity: SQLite ---
  # Base propia de este servicio (tabla app_user: usuarios y sus roles). Un
  # solo archivo, sin servidor ni Docker. Para usar otra base, pasar DB_URL.
  datasource:
    url: ${DB_URL:jdbc:sqlite:pedidos360-auth.db}
  jpa:
    hibernate:
      # 'update' crea/actualiza las tablas al arrancar. Para la demo alcanza.
      ddl-auto: ${DB_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate.dialect: org.hibernate.community.dialect.SQLiteDialect
      hibernate.format_sql: true
  sql:
    init:
      mode: never
  # Conexion al cluster de RabbitMQ (configuracion centralizada: un solo
  # lugar para host/credenciales, nada de esto se repite en el codigo).
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        acknowledge-mode: manual
        # Un mensaje rechazado (nack) no vuelve a la cola: va a su DLQ.
        default-requeue-rejected: false

app:
  # --- Roles ---
  # El rol (ADMIN / OPERADOR / CLIENTE) sale del claim "roles" del JWT de
  # Microsoft: son las App Roles asignadas en el Portal de Azure (App
  # Registration -> App roles, y Enterprise Application -> Users and groups).
  # Si una cuenta no tiene ninguna App Role reconocida asignada, el login se
  # RECHAZA (ver RoleJwtAuthenticationConverter) — no hay rol por defecto ni
  # lista de emails en este archivo.
  auth:
    microsoft:
      # "Application (client) ID" del App Registration en Azure AD.
      # Los tres servicios (auth, inventory, orders) validan el mismo claim
      # "aud", asi que tiene que coincidir con MICROSOFT_CLIENT_ID en
      # front/src/app/auth/microsoft/microsoft-auth.config.ts y con el
      # app.auth.microsoft.client-id de los otros dos servicios.
      #
      # App Registration propio (single-tenant, tenant c450c5ae-...,
      # dominio proyecto3602.onmicrosoft.com).
      client-id: ${MICROSOFT_CLIENT_ID:7b48efc0-534c-4b13-9e02-4c60a129f151}

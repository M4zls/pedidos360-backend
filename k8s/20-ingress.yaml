# ─────────────────────────────────────────────────────────────
#  Ingress del backend — publica /api/* a traves de Traefik
#  (el controller que k3s instala de fabrica, escuchando en :80).
#
#  Las rutas son exactamente las que exponen los controllers y consume el
#  SPA: /api/me (auth), /api/inventory (inventory) y /api/orders (orders).
#  No hay /api/auth ni /api/admin: ningun controller los sirve.
#
#  El front declara su propio Ingress para "/" en el otro repo.
#  Traefik prioriza las reglas por longitud del path, asi que estas
#  (/api/...) ganan sobre la "/" del front: no hay orden de aplicacion
#  entre los dos pipelines del que dependa el ruteo.
#
#  Sin "host": responde con cualquier Host header, que es lo que hace
#  falta para entrar por la IP publica (Elastic IP) sin dominio.
# ─────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pedidos360-api
  namespace: pedidos360
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          # Prefix y no Exact: cubre /api/me y tambien /api/me/consent, que el
          # SPA usa (user.service.ts). Con Exact, /api/me/consent no matchearia
          # ninguna regla, caeria en la "/" del front y devolveria 404.
          - path: /api/me
            pathType: Prefix
            backend:
              service:
                name: auth
                port:
                  number: 8080
          - path: /api/inventory
            pathType: Prefix
            backend:
              service:
                name: inventory
                port:
                  number: 8083
          - path: /api/orders
            pathType: Prefix
            backend:
              service:
                name: orders
                port:
                  number: 8081

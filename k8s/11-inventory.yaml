# ─────────────────────────────────────────────────────────────
#  inventory-service — catalogo de productos y stock.
#  Base SQLite propia (no comparte con auth ni orders) sobre su PVC.
# ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: inventory-data
  namespace: pedidos360
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: pedidos360
  labels:
    app.kubernetes.io/name: inventory
    app.kubernetes.io/part-of: pedidos360
spec:
  replicas: 1
  # Ver la nota en 10-auth.yaml: SQLite sobre PVC RWO no admite dos escritores.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory
        app.kubernetes.io/part-of: pedidos360
    spec:
      imagePullSecrets:
        - name: ecr-creds
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: inventory
          image: __IMAGE_INVENTORY__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8083
          env:
            - name: DB_URL
              value: jdbc:sqlite:/data/pedidos360-inventory.db
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC"
          envFrom:
            - secretRef:
                name: pedidos360-secrets
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 640Mi
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: inventory-data
---
apiVersion: v1
kind: Service
metadata:
  name: inventory
  namespace: pedidos360
spec:
  selector:
    app.kubernetes.io/name: inventory
  ports:
    - name: http
      port: 8083
      targetPort: http

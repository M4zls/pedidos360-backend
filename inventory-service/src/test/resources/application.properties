# Config solo para tests: base H2 embebida en modo PostgreSQL en lugar de
# SQLite (el InventoryDataInitializer siembra igual si la tabla esta vacia).
spring.datasource.url=jdbc:h2:mem:pedidos360-inventory;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never
# El application.yml fija el dialecto de SQLite; para H2 hay que volver a auto.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

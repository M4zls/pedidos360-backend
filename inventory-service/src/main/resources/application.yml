server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: pedidos360-inventory
  # Base de datos PROPIA del servicio de inventario (no comparte con auth ni pedidos).
  datasource:
    url: ${DB_URL:jdbc:sqlite:pedidos360-inventory.db}
  jpa:
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate.dialect: org.hibernate.community.dialect.SQLiteDialect
      hibernate.format_sql: true
  sql:
    init:
      mode: never
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false

app:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:4200}
  # El rol (ADMIN/OPERADOR/CLIENTE) sale del claim "roles" del JWT de
  # Microsoft (App Roles asignadas en Azure). Sin App Role reconocida, se
  # rechaza el login — ver RoleJwtAuthenticationConverter.
  auth:
    microsoft:
      # Mismo "Application (client) ID" que el servicio de auth y el front.
      client-id: ${MICROSOFT_CLIENT_ID:7b48efc0-534c-4b13-9e02-4c60a129f151}

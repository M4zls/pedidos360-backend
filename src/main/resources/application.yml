server:
  port: 8080

spring:
  application:
    name: pedidos360-backend
  # --- Inventario: SQLite ---
  # Base en un solo archivo (pedidos360.db, en la raiz del backend). Sin
  # servidor, sin Docker. Para usar otra base, pasar DB_URL.
  datasource:
    url: ${DB_URL:jdbc:sqlite:pedidos360.db}
  jpa:
    hibernate:
      # 'update' crea/actualiza las tablas al arrancar. Para la demo alcanza.
      ddl-auto: ${DB_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate.dialect: org.hibernate.community.dialect.SQLiteDialect
      hibernate.format_sql: true
  sql:
    init:
      # No usamos schema.sql / data.sql: el esquema lo crea Hibernate y los
      # datos de ejemplo los carga InventoryDataInitializer (Java).
      mode: never

app:
  auth:
    google:
      # OAuth Client ID (tipo "Web application") de Google Cloud Console.
      # Como obtenerlo: https://console.cloud.google.com -> APIs & Services
      # -> Credentials -> Create Credentials -> OAuth client ID -> Web
      # application -> Authorized JavaScript origins: http://localhost:4200
      # Debe ser EXACTAMENTE el mismo valor que GOOGLE_CLIENT_ID en
      # front/src/app/auth/google/google-auth.config.ts
      client-id: <GOOGLE_CLIENT_ID>
    microsoft:
      # "Application (client) ID" del App Registration en Azure AD.
      # El backend valida que el claim "aud" del ID token de Microsoft sea
      # EXACTAMENTE este valor, asi que tiene que coincidir con
      # MICROSOFT_CLIENT_ID en
      # front/src/app/auth/microsoft/microsoft-auth.config.ts
      #
      # Valor tomado del repo de referencia CVm0/pedidos360-frontend. El
      # backend acepta cualquier tenant (ver MICROSOFT_ISSUER_PATTERN), asi
      # que solo hace falta el client-id. Cambialo por el tuyo cuando crees
      # tu propio App Registration.
      client-id: 89fde275-566d-498a-a663-bbed17a2a29d
    local:
      # Login de USUARIO/CONTRASEÑA de ejemplo (POST /api/auth/login),
      # ademas de Google y Microsoft. Es solo para mostrar la opcion: un
      # unico usuario fijo, sin base de datos ni hash de contraseñas. No
      # usar tal cual en produccion.
      username: demo
      password: demo123
      # Clave para firmar (HS256) los JWT que emite este backend. Minimo 32
      # caracteres. Cambiala por una propia (y sacala de application.yml,
      # p.ej. variable de entorno) antes de usar esto en serio.
      jwt-secret: cambia-esta-clave-secreta-por-una-propia-de-al-menos-32-caracteres
      audience: pedidos360-front

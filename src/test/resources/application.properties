# Config solo para tests: base H2 embebida en modo PostgreSQL en lugar de la
# Postgres real, y sin el seed de produccion (data.sql).
spring.datasource.url=jdbc:h2:mem:pedidos360;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=create-drop
